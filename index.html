<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial History of Earth's Lights</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header>
        <h1>How has the growth of cities erased natural darkness?</h1>
        <p>Explore the Black Marble data to find how urban light has dominated natural darkness over time.</p>
    </header>

    <div class="controls">
    <button id="playBtn" style="padding: 5px 15px; margin-right: 15px; cursor: pointer; background-color: #f5cf6c; border: none; border-radius: 4px; font-weight: bold;">Play Animation</button>
    <label for="timeSlider">Date: <span id="dateLabel">Select a date</span></label>
    <input type="range" id="timeSlider" min="0" step="1">
    </div>

    <div id="dashboard">
        <div id="map-container">
            <h3>Night Lights Map (NASA GIBS)</h3>
            <svg id="mapSvg" width="600" height="400"></svg>
        </div>
        <div id="chart-container">
            <h3>Light Intensity Shift Over Time</h3>
            <svg id="chartSvg" width="600" height="400"></svg>
        </div>
    </div>
    
    <div id="tooltip" class="tooltip" style="opacity:0;"></div>

    <script src="script.js"></script>

</body>
</html>
